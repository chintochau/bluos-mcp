[project]
name = "bluos-mcp"
version = "0.1.0"
description = "MCP server for controlling BluOS players"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "httpx",
    "python-dotenv",
    "zeroconf",
]

[project.scripts]
bluos-mcp = "server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
